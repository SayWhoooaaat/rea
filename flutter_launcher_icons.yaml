flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/rea_icon_4.png"  # Your square icon
  adaptive_icon_background: "#ffffff"  # or any color that matches your icon's background
  adaptive_icon_foreground: "assets/rea_icon_4.png"  # Your square icon again
  #adaptive_icon_mask: circle  # This will crop your icon into a circle
  min_sdk_android: 21
  remove_alpha_ios: true
  web:
    generate: true
    image_path: "assets/rea_icon_4.png"
    background_color: "#ffffff"
    theme_color: "#ffffff"
  windows:
    generate: true
    image_path: "assets/rea_icon_4.png"
    icon_size: 48
  macos:
    generate: true
    image_path: "assets/rea_icon_4.png"